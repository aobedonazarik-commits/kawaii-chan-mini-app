<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kawaii Chan</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #222222);
        }

        .app {
            max-width: 500px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            opacity: 0.7;
            margin-bottom: 25px;
        }

        .card {
            padding: 20px;
            border-radius: 18px;
            background: var(--tg-theme-secondary-bg-color, #f2f2f2);
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body>

<div class="app">

    <h1>🌸 Kawaii Chan</h1>

    <div class="subtitle">
        Панель управления каналом
    </div>

    <div class="card">
        <h2>👋 Добро пожаловать!</h2>
        <p>
            Это наша первая Telegram Mini App.
        </p>
        <p>
            Здесь постепенно появятся инструменты
            для управления каналом.
        </p>
    </div>

    <div class="card">
        <h3>🛠 Что здесь будет</h3>
        <p>📝 Создание постов</p>
        <p>⏰ Отложенные публикации</p>
        <p>✏️ Редактирование постов</p>
        <p>📊 Статистика</p>
        <p>⚙️ Настройки канала</p>
    </div>

    <button onclick="hello()">
        💖 Проверить Mini App
    </button>

</div>

<script>
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    function hello() {
        tg.showAlert("Mini App работает! 🌸");
    }
</script>

</body>
</html>
