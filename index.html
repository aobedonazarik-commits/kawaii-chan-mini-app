<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
/>

<title>Kawaii Chan</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root {
  --bg: var(--tg-theme-bg-color, #111111);
  --secondary: var(--tg-theme-secondary-bg-color, #1b1b1b);
  --text: var(--tg-theme-text-color, #ffffff);
  --hint: var(--tg-theme-hint-color, #999999);
  --button: var(--tg-theme-button-color, #ff4fa3);
  --button-text: var(--tg-theme-button-text-color, #ffffff);
  --danger: #ff4d67;
  --border: rgba(255,255,255,.08);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    sans-serif;
}

button,
input,
textarea {
  font: inherit;
}

button {
  border: 0;
  cursor: pointer;
}

.app {
  max-width: 720px;
  margin: auto;
  padding: 14px 14px 90px;
}

.header {
  padding: 8px 4px 18px;
}

.title {
  font-size: 25px;
  font-weight: 800;
}

.subtitle {
  margin-top: 5px;
  color: var(--hint);
  font-size: 14px;
}

.section {
  display: none;
}

.section.active {
  display: block;
}

.card {
  background: var(--secondary);
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 12px;
  border: 1px solid var(--border);
}

.label {
  display: block;
  font-size: 13px;
  color: var(--hint);
  margin-bottom: 8px;
}

textarea,
input[type="text"],
input[type="datetime-local"] {
  width: 100%;
  border: 0;
  outline: none;
  background: rgba(255,255,255,.06);
  color: var(--text);
  border-radius: 13px;
  padding: 13px;
}

textarea {
  min-height: 150px;
  resize: vertical;
}

.counter {
  text-align: right;
  color: var(--hint);
  font-size: 12px;
  margin-top: 5px;
}

.primary {
  width: 100%;
  background: var(--button);
  color: var(--button-text);
  padding: 14px;
  border-radius: 14px;
  font-weight: 700;
  margin-top: 10px;
}

.secondary {
  width: 100%;
  background: rgba(255,255,255,.08);
  color: var(--text);
  padding: 13px;
  border-radius: 14px;
  margin-top: 8px;
}

.danger {
  background: var(--danger);
  color: white;
}

.file-button {
  display: block;
  text-align: center;
  background: rgba(255,255,255,.08);
  padding: 14px;
  border-radius: 14px;
  font-weight: 700;
}

.file-button input {
  display: none;
}

.preview-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
  margin-top: 12px;
}

.preview {
  position: relative;
  aspect-ratio: 1;
  overflow: hidden;
  border-radius: 10px;
  background: #222;
}

.preview img,
.preview video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.remove {
  position: absolute;
  top: 5px;
  right: 5px;
  width: 27px;
  height: 27px;
  border-radius: 50%;
  background: rgba(0,0,0,.75);
  color: white;
  font-size: 17px;
}

.file-info {
  padding: 10px 0 0;
  font-size: 13px;
  color: var(--hint);
}

.progress-wrap {
  display: none;
  margin-top: 12px;
}

.progress {
  width: 100%;
  height: 9px;
  background: rgba(255,255,255,.08);
  border-radius: 20px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: var(--button);
  transition: width .2s;
}

.progress-text {
  margin-top: 7px;
  font-size: 12px;
  color: var(--hint);
  text-align: center;
}

.bottom-nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--secondary);
  border-top: 1px solid var(--border);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  padding: 7px 5px calc(7px + env(safe-area-inset-bottom));
  z-index: 100;
}

.nav-btn {
  background: transparent;
  color: var(--hint);
  padding: 6px 2px;
  font-size: 11px;
}

.nav-btn.active {
  color: var(--button);
  font-weight: 700;
}

.nav-icon {
  display: block;
  font-size: 20px;
  margin-bottom: 2px;
}

.post {
  background: var(--secondary);
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 10px;
}

.post-title {
  font-weight: 700;
  margin-bottom: 7px;
}

.post-meta {
  color: var(--hint);
  font-size: 12px;
  line-height: 1.5;
}

.status {
  padding: 12px;
  border-radius: 12px;
  background: rgba(255,255,255,.06);
  margin-top: 10px;
  font-size: 13px;
  display: none;
}

.status.show {
  display: block;
}

.status.ok {
  border: 1px solid rgba(60,220,120,.3);
}

.status.error {
  border: 1px solid rgba(255,70,90,.4);
}

.empty {
  text-align: center;
  padding: 35px 15px;
  color: var(--hint);
}

.stat {
  display: flex;
  justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}

.stat:last-child {
  border-bottom: 0;
}

.loading {
  text-align: center;
  padding: 25px;
  color: var(--hint);
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="title">Kawaii_Chan</div>
    <div class="subtitle">Панель управления каналом</div>
  </div>

  <!-- CREATE -->
  <section id="create" class="section active">

    <div class="card">
      <label class="label">Текст публикации</label>

      <textarea
        id="postText"
        maxlength="4096"
        placeholder="Напиши текст поста..."
      ></textarea>

      <div class="counter">
        <span id="textCount">0</span> / 4096
      </div>
    </div>

    <div class="card">

      <label class="label">Фото и видео</label>

      <label class="file-button">
        📎 Выбрать файлы
        <input
          id="mediaInput"
          type="file"
          accept="image/*,video/*"
          multiple
        >
      </label>

      <div id="fileInfo" class="file-info">
        Файлы не выбраны
      </div>

      <div id="previewGrid" class="preview-grid"></div>

      <div id="progressWrap" class="progress-wrap">
        <div class="progress">
          <div id="progressBar" class="progress-bar"></div>
        </div>

        <div id="progressText" class="progress-text">
          Подготовка...
        </div>
      </div>

    </div>

    <div class="card">

      <button
        class="primary"
        id="publishBtn"
        onclick="publishPost()"
      >
        📤 Опубликовать
      </button>

      <button
        class="secondary"
        onclick="scheduleMode()"
      >
        ⏰ Отложить публикацию
      </button>

      <div id="scheduleBox" style="display:none;margin-top:12px">

        <label class="label">
          Дата и время публикации
        </label>

        <input
          id="scheduleTime"
          type="datetime-local"
        >

        <button
          class="primary"
          onclick="schedulePost()"
        >
          ⏰ Запланировать
        </button>

      </div>

      <div id="createStatus" class="status"></div>

    </div>

  </section>


  <!-- SCHEDULED -->
  <section id="scheduled" class="section">

    <div class="card">
      <button
        class="primary"
        onclick="loadScheduled()"
      >
        🔄 Обновить
      </button>
    </div>

    <div id="scheduledList"></div>

  </section>


  <!-- EDIT -->
  <section id="edit" class="section">

    <div class="card">
      <button
        class="primary"
        onclick="loadPosts()"
      >
        🔄 Загрузить публикации
      </button>
    </div>

    <div id="postsList"></div>

  </section>


  <!-- STATS -->
  <section id="stats" class="section">

    <div class="card">

      <button
        class="primary"
        onclick="loadStats()"
      >
        📊 Обновить статистику
      </button>

      <div id="statsContent" style="margin-top:12px">
        Нажми «Обновить статистику».
      </div>

    </div>

  </section>


  <!-- SETTINGS -->
  <section id="settings" class="section">

    <div class="card">

      <div style="font-size:18px;font-weight:700">
        ⚙️ Настройки
      </div>

      <div
        style="color:var(--hint);font-size:13px;margin-top:6px"
      >
        Подключение Mini App к серверу
      </div>

      <button
        class="primary"
        onclick="testBackend()"
      >
        🔌 Проверить backend
      </button>

      <div id="backendStatus" class="status"></div>

    </div>

    <div class="card">

      <div class="stat">
        <span>Канал</span>
        <strong>@ahegao_hetai_hub</strong>
      </div>

      <div class="stat">
        <span>Максимум файлов</span>
        <strong>100</strong>
      </div>

      <div class="stat">
        <span>Размер Telegram-альбома</span>
        <strong>10</strong>
      </div>

    </div>

  </section>

</div>


<!-- NAVIGATION -->

<nav class="bottom-nav">

  <button
    class="nav-btn active"
    onclick="showSection('create',this)"
  >
    <span class="nav-icon">📝</span>
    Создать
  </button>

  <button
    class="nav-btn"
    onclick="showSection('scheduled',this);loadScheduled()"
  >
    <span class="nav-icon">⏰</span>
    Отложенные
  </button>

  <button
    class="nav-btn"
    onclick="showSection('edit',this);loadPosts()"
  >
    <span class="nav-icon">✏️</span>
    Редактировать
  </button>

  <button
    class="nav-btn"
    onclick="showSection('stats',this);loadStats()"
  >
    <span class="nav-icon">📊</span>
    Статистика
  </button>

  <button
    class="nav-btn"
    onclick="showSection('settings',this)"
  >
    <span class="nav-icon">⚙️</span>
    Настройки
  </button>

</nav>


<script>

const tg = window.Telegram?.WebApp;

if (tg) {
  tg.ready();
  tg.expand();
}


/*
============================================================
BACKEND
============================================================
*/

const API =
  "https://kawaii-chan-backend.onrender.com";


/*
============================================================
STATE
============================================================
*/

let selectedFiles = [];


/*
============================================================
NAVIGATION
============================================================
*/

function showSection(id, button) {

  document
    .querySelectorAll(".section")
    .forEach(section => {
      section.classList.remove("active");
    });

  const target = document.getElementById(id);

  if (target) {
    target.classList.add("active");
  }

  document
    .querySelectorAll(".nav-btn")
    .forEach(btn => {
      btn.classList.remove("active");
    });

  if (button) {
    button.classList.add("active");
  }

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


/*
============================================================
TEXT COUNTER
============================================================
*/

const textArea =
  document.getElementById("postText");

textArea.addEventListener("input", () => {

  document.getElementById("textCount")
    .textContent =
    textArea.value.length;

});


/*
============================================================
FILE SELECT
============================================================
*/

document
  .getElementById("mediaInput")
  .addEventListener("change", event => {

    const incoming =
      Array.from(event.target.files);

    if (
      selectedFiles.length +
      incoming.length >
      100
    ) {

      showStatus(
        "createStatus",
        "Можно выбрать максимум 100 файлов.",
        false
      );

      event.target.value = "";
      return;
    }

    selectedFiles =
      selectedFiles.concat(incoming);

    event.target.value = "";

    renderPreviews();

  });


/*
============================================================
PREVIEWS
============================================================
*/

function renderPreviews() {

  const grid =
    document.getElementById("previewGrid");

  grid.innerHTML = "";

  selectedFiles.forEach((file,index) => {

    const wrapper =
      document.createElement("div");

    wrapper.className = "preview";

    const remove =
      document.createElement("button");

    remove.className = "remove";
    remove.textContent = "×";

    remove.onclick = () => {

      selectedFiles.splice(index,1);

      renderPreviews();

    };

    if (
      file.type.startsWith("video/")
    ) {

      const video =
        document.createElement("video");

      video.src =
        URL.createObjectURL(file);

      video.muted = true;
      video.playsInline = true;

      wrapper.appendChild(video);

    } else {

      const img =
        document.createElement("img");

      img.src =
        URL.createObjectURL(file);

      wrapper.appendChild(img);

    }

    wrapper.appendChild(remove);

    grid.appendChild(wrapper);

  });

  const info =
    document.getElementById("fileInfo");

  if (!selectedFiles.length) {

    info.textContent =
      "Файлы не выбраны";

    return;

  }

  const photos =
    selectedFiles.filter(
      f => f.type.startsWith("image/")
    ).length;

  const videos =
    selectedFiles.filter(
      f => f.type.startsWith("video/")
    ).length;

  info.textContent =
    `Выбрано: ${selectedFiles.length} • `
    + `фото: ${photos} • `
    + `видео: ${videos}`;

}


/*
============================================================
STATUS
============================================================
*/

function showStatus(
  elementId,
  message,
  ok = true
) {

  const element =
    document.getElementById(elementId);

  element.textContent = message;

  element.className =
    "status show " +
    (ok ? "ok" : "error");

}


/*
============================================================
UPLOAD PROGRESS
============================================================
*/

function setProgress(
  percent,
  text
) {

  document
    .getElementById("progressWrap")
    .style.display = "block";

  document
    .getElementById("progressBar")
    .style.width =
    percent + "%";

  document
    .getElementById("progressText")
    .textContent =
    text;
}


/*
============================================================
PUBLISH
============================================================
*/

async function publishPost() {

  const text =
    document.getElementById("postText")
      .value.trim();

  if (!text && !selectedFiles.length) {

    showStatus(
      "createStatus",
      "Добавь текст или хотя бы один файл.",
      false
    );

    return;
  }

  const button =
    document.getElementById("publishBtn");

  button.disabled = true;

  try {

    if (!selectedFiles.length) {

      setProgress(
        30,
        "Отправляем текст..."
      );

      const response =
        await fetch(API + "/publish", {
          method: "POST",
          headers: {
            "Content-Type":
              "application/json"
          },
          body: JSON.stringify({
            text: text
          })
        });

      const data =
        await response.json();

      if (!response.ok || !data.ok) {
        throw new Error(
          data.error ||
          "Ошибка публикации"
        );
      }

      setProgress(
        100,
        "Готово!"
      );

      showStatus(
        "createStatus",
        "✅ Пост опубликован.",
        true
      );

      clearComposer();

      return;
    }


    /*
      Делим файлы на группы:
      10 + 10 + 9 ...
    */

    const groups = [];

    for (
      let i = 0;
      i < selectedFiles.length;
      i += 10
    ) {

      groups.push(
        selectedFiles.slice(i, i + 10)
      );

    }


    for (
      let groupIndex = 0;
      groupIndex < groups.length;
      groupIndex++
    ) {

      const group =
        groups[groupIndex];

      const form =
        new FormData();

      /*
        Текст передаём только
        вместе с первой группой.
      */

      if (groupIndex === 0) {
        form.append("text", text);
      }

      group.forEach(file => {

        form.append(
          "photos",
          file,
          file.name
        );

      });

      const startPercent =
        Math.round(
          (groupIndex /
           groups.length) * 100
        );

      setProgress(
        startPercent,
        `Загружаем группу ${groupIndex + 1} из ${groups.length}...`
      );

      const response =
        await fetch(
          API + "/publish",
          {
            method: "POST",
            body: form
          }
        );

      const data =
        await response.json();

      if (!response.ok || !data.ok) {

        throw new Error(
          data.error ||
          "Ошибка публикации"
        );

      }

      const percent =
        Math.round(
          ((groupIndex + 1) /
           groups.length) * 100
        );

      setProgress(
        percent,
        `Группа ${groupIndex + 1} из ${groups.length} готова`
      );

      /*
        Небольшая пауза между
        альбомами Telegram.
      */

      if (
        groupIndex <
        groups.length - 1
      ) {

        await sleep(1000);

      }

    }

    showStatus(
      "createStatus",
      `✅ Публикация завершена. Отправлено ${selectedFiles.length} файлов.`,
      true
    );

    clearComposer();

  } catch (error) {

    console.error(error);

    showStatus(
      "createStatus",
      "❌ " + error.message,
      false
    );

  } finally {

    button.disabled = false;

  }

}


/*
============================================================
SCHEDULE MODE
============================================================
*/

function scheduleMode() {

  const box =
    document.getElementById("scheduleBox");

  box.style.display =
    box.style.display === "none"
      ? "block"
      : "none";

}


/*
============================================================
SCHEDULE
============================================================
*/

async function schedulePost() {

  const text =
    document.getElementById("postText")
      .value.trim();

  const time =
    document.getElementById("scheduleTime")
      .value;

  if (!text && !selectedFiles.length) {

    showStatus(
      "createStatus",
      "Добавь текст или файл.",
      false
    );

    return;

  }

  if (!time) {

    showStatus(
      "createStatus",
      "Выбери дату и время.",
      false
    );

    return;

  }


  const runAt =
    new Date(time)
      .toISOString();


  const form =
    new FormData();

  form.append(
    "text",
    text
  );

  form.append(
    "run_at",
    runAt
  );


  selectedFiles.forEach(file => {

    form.append(
      "photos",
      file,
      file.name
    );

  });


  try {

    setProgress(
      20,
      "Сохраняем отложенный пост..."
    );


    const response =
      await fetch(
        API + "/schedule",
        {
          method: "POST",
          body: form
        }
      );


    const data =
      await response.json();


    if (!response.ok || !data.ok) {

      throw new Error(
        data.error ||
        "Не удалось поставить пост в очередь."
      );

    }


    setProgress(
      100,
      "Пост сохранён!"
    );


    showStatus(
      "createStatus",
      "✅ Пост поставлен в очередь.",
      true
    );


    clearComposer();


  } catch (error) {

    showStatus(
      "createStatus",
      "❌ " + error.message,
      false
    );

  }

}


/*
============================================================
SCHEDULED LIST
============================================================
*/

async function loadScheduled() {

  const container =
    document.getElementById(
      "scheduledList"
    );

  container.innerHTML =
    '<div class="loading">Загрузка...</div>';


  try {

    const response =
      await fetch(
        API + "/scheduled"
      );

    const data =
      await response.json();


    if (!data.ok) {
      throw new Error(
        data.error ||
        "Ошибка загрузки"
      );
    }


    if (!data.items.length) {

      container.innerHTML =
        '<div class="empty">Отложенных постов пока нет.</div>';

      return;

    }


    container.innerHTML = "";


    data.items.forEach(item => {

      const post =
        document.createElement("div");

      post.className = "post";


      const date =
        formatDate(item.run_at);


      post.innerHTML = `
        <div class="post-title">
          ⏰ ${escapeHtml(date)}
        </div>

        <div class="post-meta">
          Статус: ${escapeHtml(item.status)}<br>
          Файлов: ${item.photo_count || 0}
          ${item.error
            ? "<br>Ошибка: " +
              escapeHtml(item.error)
            : ""}
        </div>

        ${
          item.status === "pending"
          ? `
            <button
              class="secondary danger"
              onclick="cancelScheduled(${item.id})"
            >
              Отменить
            </button>
          `
          : ""
        }
      `;


      container.appendChild(post);

    });


  } catch (error) {

    container.innerHTML =
      `<div class="empty">
        ❌ ${escapeHtml(error.message)}
      </div>`;

  }

}


/*
============================================================
CANCEL SCHEDULED
============================================================
*/

async function cancelScheduled(id) {

  if (
    !confirm(
      "Отменить этот отложенный пост?"
    )
  ) {
    return;
  }


  try {

    const response =
      await fetch(
        API +
        "/scheduled/" +
        id,
        {
          method: "DELETE"
        }
      );


    const data =
      await response.json();


    if (!response.ok || !data.ok) {

      throw new Error(
        data.error ||
        "Не удалось отменить пост."
      );

    }


    loadScheduled();


  } catch (error) {

    alert(
      "Ошибка: " +
      error.message
    );

  }

}


/*
============================================================
POST HISTORY
============================================================
*/

async function loadPosts() {

  const container =
    document.getElementById(
      "postsList"
    );


  container.innerHTML =
    '<div class="loading">Загрузка...</div>';


  try {

    const response =
      await fetch(
        API + "/posts"
      );


    const data =
      await response.json();


    if (!data.ok) {
      throw new Error(
        data.error ||
        "Ошибка загрузки"
      );
    }


    if (!data.items.length) {

      container.innerHTML =
        '<div class="empty">Опубликованных постов пока нет.</div>';

      return;

    }


    container.innerHTML = "";


    data.items.forEach(item => {

      const post =
        document.createElement("div");

      post.className = "post";


      const safeText =
        escapeHtml(
          item.text || "(без текста)"
        );


      post.innerHTML = `
        <div class="post-title">
          #${item.id}
        </div>

        <div class="post-meta">
          ${safeText}<br><br>
          Файлов: ${item.photo_count || 0}<br>
          Тип: ${escapeHtml(item.post_type || "text")}<br>
          ${escapeHtml(formatDate(item.created_at))}
        </div>

        ${
          item.text
          ? `
            <button
              class="secondary"
              onclick="editPost(${item.id}, ${JSON.stringify(item.text)})"
            >
              ✏️ Изменить текст
            </button>
          `
          : ""
        }
      `;


      container.appendChild(post);

    });


  } catch (error) {

    container.innerHTML =
      `<div class="empty">
        ❌ ${escapeHtml(error.message)}
      </div>`;

  }

}


/*
============================================================
EDIT POST TEXT
============================================================
*/

async function editPost(
  id,
  currentText
) {

  const newText =
    prompt(
      "Новый текст публикации:",
      currentText
    );


  if (
    newText === null ||
    !newText.trim()
  ) {
    return;
  }


  try {

    const response =
      await fetch(
        API + "/posts/edit",
        {
          method: "POST",
          headers: {
            "Content-Type":
              "application/json"
          },
          body: JSON.stringify({
            id: id,
            text: newText.trim()
          })
        }
      );


    const data =
      await response.json();


    if (!response.ok || !data.ok) {

      throw new Error(
        data.error ||
        "Не удалось изменить пост."
      );

    }


    alert(
      "Пост изменён."
    );


    loadPosts();


  } catch (error) {

    alert(
      "Ошибка: " +
      error.message
    );

  }

}


/*
============================================================
STATS
============================================================
*/

async function loadStats() {

  const container =
    document.getElementById(
      "statsContent"
    );


  container.innerHTML =
    "Загрузка...";


  try {

    const response =
      await fetch(
        API + "/stats"
      );


    const data =
      await response.json();


    if (!response.ok || !data.ok) {

      throw new Error(
        data.error ||
        "Не удалось получить статистику."
      );

    }


    const stats =
      data.stats ||
      data;


    container.innerHTML =
      renderStats(stats);


  } catch (error) {

    container.innerHTML =
      `<div class="status show error">
        ❌ ${escapeHtml(error.message)}
      </div>`;

  }

}


function renderStats(stats) {

  const entries =
    Object.entries(stats);


  if (!entries.length) {

    return `
      <div class="empty">
        Статистика пока пустая.
      </div>
    `;

  }


  return entries
    .map(([key,value]) => `
      <div class="stat">
        <span>${escapeHtml(
          prettifyKey(key)
        )}</span>

        <strong>${escapeHtml(
          String(value)
        )}</strong>
      </div>
    `)
    .join("");

}

/*
============================================================
HELPERS
============================================================
*/

function sleep(ms) {

  return new Promise(
    resolve => setTimeout(
      resolve,
      ms
    )
  );

}


function formatDate(value) {

  if (!value) {
    return "—";
  }

  try {

    return new Date(value)
      .toLocaleString(
        "ru-RU",
        {
          dateStyle: "short",
          timeStyle: "short"
        }
      );

  } catch {

    return value;

  }

}


function escapeHtml(value) {

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function prettifyKey(key) {

  return String(key)
    .replaceAll("_"," ")
    .replace(
      /^./,
      c => c.toUpperCase()
    );

}
